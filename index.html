<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1.0,viewport-fit=cover,interactive-widget=resizes-content"/>
  <meta name="theme-color" content="#1D428A"/>
  <meta name="apple-mobile-web-app-capable" content="yes"/>
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent"/>
  <meta name="apple-mobile-web-app-title" content="HeronBasket"/>
  <link rel="manifest" href="manifest.json"/>
  <title>HeronBasket</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet"/>
  <style>
    :root{
      --bg:#F2F5FB; --surface:#fff; --surface2:#E8EDF8; --border:#D0D8EF;
      --gold:#FFC72C; --gold-dim:#D9A800; --gold-glow:rgba(255,199,44,.16);
      --blue:#1D428A; --blue-light:#2550A8; --blue-glow:rgba(29,66,138,.09);
      --text:#0B1830; --muted:#6B7A9A; --red:#D93025; --green:#1A8745;
      --radius:16px; --tab-h:58px;
    }
    *{box-sizing:border-box;margin:0;padding:0;-webkit-tap-highlight-color:transparent}
    html{height:100%;-webkit-text-size-adjust:100%;text-size-adjust:100%}
    body{min-height:100%;background:var(--bg);color:var(--text);font-family:'DM Sans',sans-serif;overflow-x:hidden;overscroll-behavior-y:contain;-webkit-font-smoothing:antialiased}

    /* ── LOGIN SCREEN ── */
    .login-screen{
      position:fixed;inset:0;z-index:999;
      background:var(--blue);
      display:flex;flex-direction:column;align-items:center;justify-content:center;
      padding:24px 20px;padding-top:calc(env(safe-area-inset-top,0) + 24px);
    }
    .login-logo{font-family:'Bebas Neue',sans-serif;font-size:3rem;letter-spacing:3px;color:var(--gold);margin-bottom:4px;line-height:1}
    .login-logo span{color:#fff}
    .login-subtitle{font-size:.82rem;color:rgba(255,255,255,.5);letter-spacing:.5px;text-transform:uppercase;margin-bottom:36px}
    .login-card{background:#fff;border-radius:20px;padding:24px 20px;width:100%;max-width:360px;box-shadow:0 8px 32px rgba(0,0,0,.25)}
    .login-title{font-family:'Bebas Neue',sans-serif;font-size:1.4rem;color:var(--blue);letter-spacing:1px;margin-bottom:18px;text-align:center}
    .login-group{margin-bottom:14px}
    .login-group label{display:block;font-size:.78rem;color:var(--blue);font-weight:600;margin-bottom:6px}
    .login-group input{
      width:100%;background:var(--bg);border:1.5px solid var(--border);border-radius:12px;
      padding:14px 15px;color:var(--text);font-family:'DM Sans',sans-serif;font-size:16px;
      outline:none;transition:border-color .18s;-webkit-appearance:none;
    }
    .login-group input:focus{border-color:var(--blue);box-shadow:0 0 0 3px var(--blue-glow)}
    .login-btn{
      width:100%;padding:15px;border-radius:14px;border:none;
      background:var(--blue);color:#fff;font-family:'DM Sans',sans-serif;
      font-size:1rem;font-weight:700;cursor:pointer;margin-top:4px;
      min-height:52px;letter-spacing:.2px;transition:opacity .15s;
    }
    .login-btn:active{opacity:.82}
    .login-btn:disabled{opacity:.4;cursor:not-allowed}
    .login-error{font-size:.8rem;color:var(--red);margin-top:10px;text-align:center;min-height:20px}
    .login-viewer-link{display:block;text-align:center;margin-top:14px;font-size:.8rem;color:rgba(255,255,255,.55);cursor:pointer;text-decoration:underline}
    .login-viewer-link:hover{color:var(--gold)}

    /* login tabs */
    .login-tabs{display:flex;gap:0;margin-bottom:18px;border-radius:12px;overflow:hidden;border:1.5px solid var(--border)}
    .login-tab{flex:1;padding:11px 8px;border:none;background:var(--bg);color:var(--muted);font-family:'DM Sans',sans-serif;font-size:.82rem;font-weight:600;cursor:pointer;transition:all .18s;text-align:center}
    .login-tab.active{background:var(--blue);color:#fff}
    .login-tab:first-child{border-radius:10px 0 0 10px}
    .login-tab:last-child{border-radius:0 10px 10px 0}
    /* divider */
    .login-divider{display:flex;align-items:center;gap:10px;margin:14px 0;color:var(--muted);font-size:.75rem}
    .login-divider::before,.login-divider::after{content:'';flex:1;height:1px;background:var(--border)}
    /* google btn */
    .login-google-btn{
      width:100%;padding:14px;border-radius:14px;border:1.5px solid var(--border);
      background:#fff;color:var(--text);font-family:'DM Sans',sans-serif;
      font-size:.92rem;font-weight:600;cursor:pointer;display:flex;align-items:center;
      justify-content:center;gap:10px;transition:border-color .18s,box-shadow .18s;min-height:50px;
    }
    .login-google-btn:hover{border-color:var(--blue);box-shadow:0 0 0 3px var(--blue-glow)}
    .login-google-btn:active{opacity:.8}
    .login-google-btn svg{flex-shrink:0}
    /* register link */
    .login-switch{text-align:center;margin-top:12px;font-size:.8rem;color:var(--muted)}
    .login-switch a{color:var(--blue);font-weight:600;cursor:pointer;text-decoration:none}
    /* spinner inside btn */
    .spinner-sm{width:18px;height:18px;border:2px solid rgba(255,255,255,.4);border-top-color:#fff;border-radius:50%;animation:spin .6s linear infinite;display:inline-block}
    .spinner-sm.dark{border-color:rgba(29,66,138,.2);border-top-color:var(--blue)}

    /* ── HEADER ── */
    header{position:sticky;top:0;z-index:100;background:var(--blue);border-bottom:3px solid var(--gold);padding-top:env(safe-area-inset-top,0);box-shadow:0 2px 12px rgba(29,66,138,.25)}
    .header-inner{display:flex;align-items:center;justify-content:space-between;padding:11px 16px;gap:10px;min-height:50px;user-select:none}
    .logo{font-family:'Bebas Neue',sans-serif;font-size:1.6rem;letter-spacing:2px;color:var(--gold);flex-shrink:0;line-height:1}
    .logo span{color:#fff}
    .header-right{display:flex;align-items:center;gap:8px;flex-shrink:0}
    .season-pill{font-family:'Bebas Neue',sans-serif;font-size:.85rem;letter-spacing:1px;color:var(--blue);background:var(--gold);border-radius:20px;padding:4px 11px;line-height:1.2}
    /* User badge in header */
    .user-badge{
      display:flex;align-items:center;gap:6px;
      background:rgba(255,255,255,.12);border:1px solid rgba(255,255,255,.2);
      border-radius:20px;padding:4px 10px 4px 6px;cursor:pointer;
      transition:background .15s;
    }
    .user-badge:active{background:rgba(255,255,255,.2)}
    .user-avatar{
      width:24px;height:24px;border-radius:50%;
      display:flex;align-items:center;justify-content:center;
      font-size:.75rem;font-weight:700;flex-shrink:0;
    }
    .user-avatar.admin{background:var(--gold);color:var(--blue)}
    .user-avatar.viewer{background:rgba(255,255,255,.25);color:#fff}
    .user-role{font-size:.68rem;font-weight:600;text-transform:uppercase;letter-spacing:.4px;color:rgba(255,255,255,.7)}
    .user-role.admin{color:var(--gold)}

    /* ── BOTTOM TAB BAR ── */
    .tab-bar{position:fixed;bottom:0;left:0;right:0;z-index:200;background:var(--blue);border-top:2.5px solid var(--gold);display:flex;flex-direction:column;box-shadow:0 -2px 12px rgba(29,66,138,.22)}
    .tab-bar-btns{display:flex;width:100%}
    .tab-bar-spacer{height:env(safe-area-inset-bottom,0);min-height:var(--extra-bottom,0px);background:var(--blue);width:100%;flex-shrink:0}
    .tab-btn{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;border:none;background:transparent;cursor:pointer;color:rgba(255,255,255,.45);padding:8px 4px;height:var(--tab-h);position:relative;transition:color .18s;-webkit-tap-highlight-color:transparent}
    .tab-btn::after{content:'';position:absolute;bottom:0;left:25%;right:25%;height:2px;background:var(--gold);border-radius:2px 2px 0 0;transform:scaleX(0);transition:transform .2s}
    .tab-btn.active{color:var(--gold)}
    .tab-btn.active::after{transform:scaleX(1)}
    .tab-btn svg{width:23px;height:23px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round;flex-shrink:0}
    .tab-label{font-size:.64rem;font-weight:600;letter-spacing:.4px;text-transform:uppercase}

    /* ── FAB (admin only) ── */
    .fab{position:fixed;bottom:calc(var(--tab-h) + env(safe-area-inset-bottom,0) + var(--extra-bottom,0px) + 12px);right:16px;z-index:201;width:52px;height:52px;border-radius:50%;background:var(--gold);color:var(--blue);border:none;cursor:pointer;font-size:1.6rem;font-weight:700;box-shadow:0 4px 20px rgba(255,199,44,.6);display:flex;align-items:center;justify-content:center;transition:transform .12s,box-shadow .12s}
    .fab:active{transform:scale(.88);box-shadow:0 2px 10px rgba(255,199,44,.4)}

    /* ── VIEWER BANNER ── */
    .viewer-banner{
      background:linear-gradient(90deg,var(--blue-light),var(--blue));
      border-radius:12px;padding:10px 14px;margin-bottom:11px;
      display:flex;align-items:center;gap:10px;
      font-size:.8rem;color:rgba(255,255,255,.8);
    }
    .viewer-banner svg{flex-shrink:0;opacity:.7}

    /* ── MAIN ── */
    main{padding:13px 13px 0;max-width:540px;margin:0 auto;padding-bottom:calc(var(--tab-h) + env(safe-area-inset-bottom,0) + var(--extra-bottom,0px) + 80px);-webkit-overflow-scrolling:touch}

    /* SECTION HEADER */
    .section-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:11px;gap:8px;flex-wrap:wrap}
    .section-title{font-family:'Bebas Neue',sans-serif;font-size:1.4rem;letter-spacing:1px;color:var(--blue)}
    .badge{background:var(--gold-glow);color:var(--blue);border:1px solid var(--gold-dim);border-radius:20px;padding:2px 9px;font-size:.69rem;font-weight:700}

    /* SEASON BANNER */
    .season-banner{background:linear-gradient(135deg,var(--blue) 0%,var(--blue-light) 100%);border-radius:var(--radius);padding:14px 16px;margin-bottom:11px;display:flex;align-items:center;justify-content:space-between;gap:10px;box-shadow:0 2px 10px rgba(29,66,138,.18)}
    .season-banner-label{font-size:.66rem;color:rgba(255,255,255,.55);letter-spacing:.5px;text-transform:uppercase;margin-bottom:2px}
    .season-banner-year{font-family:'Bebas Neue',sans-serif;font-size:1.7rem;color:var(--gold);letter-spacing:2px;line-height:1}

    /* HERON STATS */
    .heron-stats{display:flex;gap:6px;margin-bottom:11px;flex-wrap:wrap}
    .hstat{font-size:.71rem;font-weight:700;padding:6px 13px;border-radius:20px;letter-spacing:.3px}
    .hstat.win {background:rgba(26,135,69,.1);color:var(--green);border:1px solid rgba(26,135,69,.28)}
    .hstat.loss{background:rgba(217,48,37,.09);color:var(--red);border:1px solid rgba(217,48,37,.28)}
    .hstat.pts {background:var(--gold-glow);color:var(--blue);border:1px solid var(--gold-dim)}

    /* FILTERS */
    .filters{display:flex;gap:6px;margin-bottom:11px;overflow-x:auto;padding-bottom:2px;scrollbar-width:none;-webkit-overflow-scrolling:touch}
    .filters::-webkit-scrollbar{display:none}
    .filter-chip{flex-shrink:0;padding:8px 15px;border-radius:20px;border:1.5px solid var(--border);background:var(--surface);color:var(--muted);font-size:.75rem;font-weight:500;cursor:pointer;font-family:'DM Sans',sans-serif;min-height:38px;display:flex;align-items:center;white-space:nowrap;-webkit-tap-highlight-color:transparent}
    .filter-chip.active{border-color:var(--blue);background:var(--blue);color:#fff;font-weight:600}
    .filter-chip:active{opacity:.75}

    /* MATCH CARD */
    .match-card{background:var(--surface);border:1.5px solid var(--border);border-radius:var(--radius);padding:13px 14px;margin-bottom:10px;position:relative;overflow:hidden;animation:fadeUp .22s ease both;box-shadow:0 1px 5px rgba(29,66,138,.07)}
    .match-card::before{content:'';position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--gold);border-radius:4px 0 0 4px}
    .match-card.played::before{background:var(--green)}
    .match-card.cancelled::before{background:var(--red)}
    @keyframes fadeUp{from{opacity:0;transform:translateY(7px)}to{opacity:1;transform:translateY(0)}}

    .card-top{display:flex;align-items:flex-start;justify-content:space-between;margin-bottom:10px;gap:6px}
    .match-date{font-size:.72rem;color:var(--muted);display:flex;align-items:center;gap:4px;padding-top:2px;flex-shrink:0}
    .chip-row{display:flex;align-items:center;gap:4px;flex-wrap:wrap;justify-content:flex-end}
    .status-chip{font-size:.61rem;font-weight:700;padding:3px 8px;border-radius:20px;letter-spacing:.4px;text-transform:uppercase;white-space:nowrap}
    .status-chip.scheduled{background:var(--gold-glow);color:var(--blue);border:1px solid var(--gold-dim)}
    .status-chip.played   {background:rgba(26,135,69,.1);color:var(--green);border:1px solid rgba(26,135,69,.28)}
    .status-chip.cancelled{background:rgba(217,48,37,.1);color:var(--red);border:1px solid rgba(217,48,37,.28)}
    .heron-result{font-size:.61rem;font-weight:700;padding:3px 7px;border-radius:12px;letter-spacing:.3px;white-space:nowrap}
    .heron-result.win {background:rgba(26,135,69,.1);color:var(--green);border:1px solid rgba(26,135,69,.28)}
    .heron-result.loss{background:rgba(217,48,37,.1);color:var(--red);border:1px solid rgba(217,48,37,.28)}
    .heron-result.draw{background:var(--gold-glow);color:var(--blue);border:1px solid var(--gold-dim)}

    .teams-row{display:grid;grid-template-columns:1fr 36px 1fr;align-items:center;gap:6px}
    .team{display:flex;flex-direction:column}
    .team.away{align-items:flex-end}
    .team-name{font-family:'Bebas Neue',sans-serif;font-size:1.05rem;letter-spacing:.4px;color:var(--blue);line-height:1.15;word-break:break-word;hyphens:auto}
    .team-city{font-size:.63rem;color:var(--muted);margin-top:1px}
    .team-score{font-size:1.5rem;font-weight:700;color:var(--gold-dim);margin-top:3px;line-height:1}
    .vs{font-family:'Bebas Neue',sans-serif;font-size:.9rem;color:var(--muted);text-align:center}

    .card-footer{display:flex;align-items:center;justify-content:space-between;margin-top:10px;padding-top:9px;border-top:1px solid var(--border);gap:6px}
    .location-link{font-size:.71rem;color:var(--blue);display:flex;align-items:center;gap:4px;text-decoration:none;flex:1;overflow:hidden;min-width:0}
    .location-link span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .map-badge{flex-shrink:0;background:var(--blue);color:#fff;font-size:.57rem;font-weight:700;padding:2px 5px;border-radius:4px;letter-spacing:.3px}
    .card-actions{display:flex;gap:7px;flex-shrink:0}
    .icon-btn{width:40px;height:40px;border-radius:11px;border:1.5px solid var(--border);background:var(--surface2);color:var(--muted);cursor:pointer;display:flex;align-items:center;justify-content:center;font-size:.9rem;-webkit-tap-highlight-color:transparent}
    .icon-btn:active{background:var(--blue-glow);border-color:var(--blue);color:var(--blue)}
    .icon-btn.danger:active{background:rgba(217,48,37,.08);border-color:var(--red);color:var(--red)}

    /* TEAM CARD */
    .team-card{background:var(--surface);border:1.5px solid var(--border);border-radius:var(--radius);padding:13px 14px;margin-bottom:10px;position:relative;overflow:hidden;animation:fadeUp .25s ease both;display:flex;align-items:center;justify-content:space-between;gap:12px;box-shadow:0 1px 6px rgba(29,66,138,.06)}
    .team-card::before{content:'';position:absolute;left:0;top:0;bottom:0;width:4px;background:var(--blue)}
    .team-card-heron{border-color:rgba(29,66,138,.3)}
    .team-card-heron::before{background:var(--gold)}
    .team-card-info{flex:1;min-width:0}
    .team-card-name{font-family:'Bebas Neue',sans-serif;font-size:1.1rem;letter-spacing:.5px;color:var(--blue)}
    .team-card-city{font-size:.72rem;color:var(--muted);margin-top:1px}
    .team-card-gym{display:flex;align-items:center;gap:5px;margin-top:6px;font-size:.73rem;color:var(--blue);text-decoration:none}
    .team-card-gym-text{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .team-card-actions{display:flex;gap:6px;flex-shrink:0}

    /* ARCHIVE */
    .archive-year{background:var(--surface);border:1.5px solid var(--border);border-radius:var(--radius);margin-bottom:10px;overflow:hidden}
    .archive-year-header{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;cursor:pointer;user-select:none;gap:10px;min-height:56px}
    .archive-year-header:active{background:var(--surface2)}
    .archive-year-label{font-family:'Bebas Neue',sans-serif;font-size:1.2rem;color:var(--blue);letter-spacing:1px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}
    .archive-year-meta{font-size:.72rem;color:var(--muted);font-family:'DM Sans',sans-serif;font-weight:400}
    .archive-chevron{font-size:.75rem;color:var(--muted);transition:transform .2s;flex-shrink:0}
    .archive-year.open .archive-chevron{transform:rotate(180deg)}
    .archive-body{display:none;padding:0 10px 10px}
    .archive-year.open .archive-body{display:block}
    .archive-stats{display:flex;gap:6px;flex-wrap:wrap;padding:8px 0 6px}
    .btn-new-season{background:var(--gold);color:var(--blue);border:none;border-radius:10px;padding:9px 14px;font-family:'DM Sans',sans-serif;font-size:.8rem;font-weight:700;cursor:pointer;white-space:nowrap;min-height:38px}
    .btn-new-season:active{opacity:.8}
    .btn-del-cancelled{background:rgba(217,48,37,.1);color:var(--red);border:1.5px solid rgba(217,48,37,.3);border-radius:10px;padding:7px 12px;font-family:'DM Sans',sans-serif;font-size:.78rem;font-weight:700;cursor:pointer;white-space:nowrap;min-height:36px;transition:background .15s}
    .btn-del-cancelled:active{background:rgba(217,48,37,.22)}

    /* EMPTY */
    .empty{text-align:center;padding:48px 20px;color:var(--muted)}
    .empty-icon{font-size:3rem;margin-bottom:12px}
    .empty h3{font-family:'Bebas Neue',sans-serif;font-size:1.3rem;color:var(--blue);margin-bottom:8px}
    .empty p{font-size:.85rem;line-height:1.5}

    /* MODAL */
    .overlay{position:fixed;inset:0;z-index:400;background:rgba(11,24,48,.7);backdrop-filter:blur(6px);-webkit-backdrop-filter:blur(6px);display:flex;align-items:flex-end;justify-content:center;opacity:0;pointer-events:none;transition:opacity .22s}
    .overlay.open{opacity:1;pointer-events:all}
    .modal{background:var(--surface);border-top:4px solid var(--gold);border-radius:22px 22px 0 0;width:100%;max-width:540px;padding:6px 16px 0;padding-bottom:calc(20px + env(safe-area-inset-bottom,0));transform:translateY(100%);transition:transform .3s cubic-bezier(.32,1.1,.6,1);max-height:88vh;overflow-y:auto;-webkit-overflow-scrolling:touch;overscroll-behavior:contain}
    .modal::before{content:'';display:block;width:36px;height:4px;background:var(--border);border-radius:4px;margin:10px auto 16px}
    .overlay.open .modal{transform:translateY(0)}
    .modal-title{font-family:'Bebas Neue',sans-serif;font-size:1.4rem;letter-spacing:1px;color:var(--blue);margin-bottom:14px;display:flex;align-items:center;justify-content:space-between}
    .close-btn{background:var(--surface2);border:1.5px solid var(--border);color:var(--muted);width:38px;height:38px;border-radius:11px;cursor:pointer;font-size:1.1rem;display:flex;align-items:center;justify-content:center;flex-shrink:0}
    .close-btn:active{background:var(--border)}

    /* FORM */
    .form-group{margin-bottom:13px}
    .form-group label{display:block;font-size:.77rem;color:var(--blue);margin-bottom:6px;font-weight:600;letter-spacing:.3px}
    .form-group input,.form-group select,.form-group textarea{width:100%;background:var(--bg);border:1.5px solid var(--border);border-radius:13px;padding:14px 15px;color:var(--text);font-family:'DM Sans',sans-serif;font-size:16px;outline:none;transition:border-color .18s,box-shadow .18s;-webkit-appearance:none;appearance:none}
    .form-group input:focus,.form-group select:focus,.form-group textarea:focus{border-color:var(--blue);box-shadow:0 0 0 3px var(--blue-glow)}
    .form-row{display:grid;grid-template-columns:1fr 1fr;gap:10px}
    .score-row{display:grid;grid-template-columns:1fr 30px 1fr;align-items:center;gap:8px}
    .score-sep{font-family:'Bebas Neue',sans-serif;font-size:1.2rem;color:var(--muted);text-align:center}
    .location-input-wrap{position:relative}
    .location-input-wrap input{padding-right:52px}
    .map-open-btn{position:absolute;right:8px;top:50%;transform:translateY(-50%);width:38px;height:38px;border-radius:11px;border:none;background:var(--blue);color:#fff;cursor:pointer;font-size:1rem;display:flex;align-items:center;justify-content:center}
    .map-open-btn:active{opacity:.8}
    .btn-primary{width:100%;padding:16px;border-radius:15px;border:none;background:var(--blue);color:#fff;font-family:'DM Sans',sans-serif;font-size:1rem;font-weight:600;cursor:pointer;margin-top:6px;min-height:54px;letter-spacing:.2px;-webkit-tap-highlight-color:transparent}
    .btn-primary:active{opacity:.82}
    .btn-primary:disabled{opacity:.38;cursor:not-allowed}

<script>
// ── ANDROID NAV BAR DETECTION ──
// On Android, visualViewport.height < window.innerHeight when nav bar is visible.
// We use this gap to add extra bottom padding beyond safe-area-inset-bottom.
function fixAndroidNavBar() {
  const vv = window.visualViewport;
  if (!vv) return;
  // Gap between visual viewport bottom and window bottom = nav bar height
  const gap = window.innerHeight - (vv.offsetTop + vv.height);
  // safe-area-inset-bottom should already cover it on most devices,
  // but on some Android browsers it returns 0 even with a nav bar.
  // We set --extra-bottom only when gap > safe-area-inset-bottom
  const safeBottom = parseInt(
    getComputedStyle(document.documentElement)
      .getPropertyValue('--_sab') || '0'
  ) || 0;
  const extra = Math.max(0, gap - safeBottom);
  document.documentElement.style.setProperty('--extra-bottom', extra + 'px');
}

// Read actual safe-area-inset-bottom into a var we can use in JS
(function(){
  const div = document.createElement('div');
  div.style.cssText = 'position:fixed;bottom:env(safe-area-inset-bottom,0);height:0;visibility:hidden';
  document.documentElement.appendChild(div);
  const sab = div.getBoundingClientRect().bottom;
  document.documentElement.style.setProperty('--_sab', sab + 'px');
  div.remove();
})();

if (window.visualViewport) {
  window.visualViewport.addEventListener('resize', fixAndroidNavBar);
  window.visualViewport.addEventListener('scroll', fixAndroidNavBar);
}
window.addEventListener('resize', fixAndroidNavBar);
fixAndroidNavBar();
</script>

      _doShowApp(user,isAdmin);
    } else {
      showLogin();
    }
  });
});

// ── LOGIN ──
window.doLogin=async function(){
  const btn=document.getElementById('loginBtn');
  const email=document.getElementById('loginEmail').value.trim();
  const pass=document.getElementById('loginPassword').value;
  const err=document.getElementById('loginError');
  err.textContent='';
  if(!email||!pass){err.textContent='Inserisci email e password';return;}
  btn.disabled=true; btn.innerHTML='<span class="spinner-sm"></span>';
  try{
    const cred=await signInWithEmailAndPassword(auth,email,pass);
    const isAdmin=ADMIN_EMAILS.map(e=>e.toLowerCase()).includes((cred.user.email||'').toLowerCase());
    _doShowApp(cred.user,isAdmin);
  }catch(e){
    err.textContent=_authErrMsg(e.code);
    btn.disabled=false; btn.textContent='Accedi';
  }
};

// ── REGISTRAZIONE ──
window.doRegister=async function(){
  const btn=document.getElementById('regBtn');
  const name=document.getElementById('regName').value.trim();
  const email=document.getElementById('regEmail').value.trim();
  const pass=document.getElementById('regPassword').value;
  const err=document.getElementById('regError');
  err.textContent='';
  if(!email||!pass){err.textContent='Inserisci email e password';return;}
  if(pass.length<6){err.textContent='Password minimo 6 caratteri';return;}
  btn.disabled=true; btn.innerHTML='<span class="spinner-sm"></span>';
  try{
    const cred=await createUserWithEmailAndPassword(auth,email,pass);
    if(name) await updateProfile(cred.user,{displayName:name});
    const isAdmin=ADMIN_EMAILS.map(e=>e.toLowerCase()).includes((cred.user.email||'').toLowerCase());
    _doShowApp(cred.user,isAdmin);
  }catch(e){
    err.textContent=_authErrMsg(e.code);
    btn.disabled=false; btn.textContent='Crea account';
  }
};

// ── GOOGLE (usa redirect — funziona su Android e mobile) ──
window.doGoogleLogin=async function(){
  const provider=new GoogleAuthProvider();
  provider.addScope('email');
  provider.addScope('profile');
  try{
    // Prova prima popup (desktop/browser), fallback redirect (Android/mobile)
    try{
      const result=await signInWithPopup(auth,provider);
      const isAdmin=ADMIN_EMAILS.map(e=>e.toLowerCase()).includes((result.user.email||'').toLowerCase());
      _doShowApp(result.user,isAdmin);
    }catch(popupErr){
      if(popupErr.code==='auth/popup-blocked'||popupErr.code==='auth/popup-closed-by-user'||popupErr.code==='auth/cancelled-popup-request'){
        // Popup bloccato → usa redirect
        await signInWithRedirect(auth,provider);
        // La pagina si ricarica, il risultato viene gestito da getRedirectResult() all'avvio
      } else {
        throw popupErr;
      }
    }
  }catch(e){
    if(e.code!=='auth/popup-closed-by-user')
      document.getElementById('loginError').textContent=_authErrMsg(e.code);
  }
};

// ── OSPITE ──
window.doGuestAccess=async function(){
  try{
    const cred=await signInAnonymously(auth);
    _doShowApp(cred.user,false);
  }catch(e){ showToast('Errore accesso ospite'); }
};

// ── LOGOUT ──
window.doLogout=async function(){
  closeOverlay('logoutOverlay');
  if(unsubMatches){unsubMatches();unsubMatches=null;}
  if(unsubTeams){unsubTeams();unsubTeams=null;}
  if(unsubSeason){unsubSeason();unsubSeason=null;}
  window._st.matches=[];window._st.teams=[];window._st.currentSeason=null;
  _authReady=false; // permetti a onAuthStateChanged di agire al prossimo avvio
  await signOut(auth);
  showLogin();
};

function _authErrMsg(code){
  const m={
    'auth/invalid-credential':'Email o password errati',
    'auth/user-not-found':'Nessun account con questa email',
    'auth/wrong-password':'Password errata',
    'auth/email-already-in-use':'Email già registrata',
    'auth/weak-password':'Password troppo corta (min. 6)',
    'auth/invalid-email':'Email non valida',
    'auth/too-many-requests':'Troppi tentativi. Riprova tra poco',
    'auth/popup-closed-by-user':'Accesso Google annullato',
    'auth/network-request-failed':'Errore di rete',
  };
  return m[code]||'Errore: '+code;
}

function showLogin(){
  document.getElementById('loginScreen').style.display='flex';
  document.getElementById('appShell').style.display='none';
  // reset form
  ['loginEmail','loginPassword','regName','regEmail','regPassword'].forEach(id=>{

  ['loginError','regError'].forEach(id=>{
    const el=document.getElementById(id); if(el) el.textContent='';
  });

    const el=document.getElementById(id);

  });
}

function _doShowApp(user,isAdmin){
  window._st.isAdmin=isAdmin;
  window._st.currentUser=user;

  document.getElementById('appShell').style.display='block';

// ── FIREBASE LISTENERS ──
function startListeners(){
  if(!db) return;
  [unsubMatches,unsubTeams,unsubSeason].forEach(u=>u&&u());

  unsubSeason=onSnapshot(doc(db,'meta','activeSeason'),snap=>{
    window._st.currentSeason=snap.exists()?{id:snap.data().seasonId,label:snap.data().label}:null;
    updateSeasonPill();
    restartMatchListener();
  });
  unsubTeams=onSnapshot(query(collection(db,'teams'),orderBy('name','asc')),snap=>{
    window._st.teams=snap.docs.map(d=>({id:d.id,...d.data()}));
    renderApp();
  },err=>console.error(err));
}

function restartMatchListener(){
  if(unsubMatches) unsubMatches();
  if(!window._st.currentSeason){window._st.matches=[];renderApp();return;}
  const q=query(collection(db,'seasons',window._st.currentSeason.id,'matches'),orderBy('datetime','asc'));
  unsubMatches=onSnapshot(q,snap=>{
    window._st.matches=snap.docs.map(d=>({id:d.id,...d.data()}));
    renderApp();
  },()=>{showToast('⚠️ Errore Firebase');renderApp();});
}

function updateSeasonPill(){
  const p=document.getElementById('seasonPill');
  if(p) p.textContent=window._st.currentSeason?window._st.currentSeason.label:'—';
}

// ── HELPERS ──
function mapsUrl(addr){return addr?'https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(addr):null;}
function teamById(id){return window._st.teams.find(t=>t.id===id)||null;}
function heronStats(matches){
  const h=window._st.teams.find(t=>t.name.trim().toLowerCase().includes('heron'));
  if(!h) return null;
  const played=matches.filter(m=>m.status==='played'&&(m.homeId===h.id||m.awayId===h.id));
  let w=0,l=0;
  played.forEach(m=>{const ih=m.homeId===h.id,hs=Number(m.score_home??0),as_=Number(m.score_away??0);if(ih?hs>as_:as_>hs)w++;else l++;});
  return{wins:w,losses:l,pts:w*2};
}

// ── ARCHIVE ──
async function renderArchive(c){
  const isAdmin=window._st.isAdmin;
  c.innerHTML=`<div class="section-header"><div class="section-title">Archivio</div></div><div class="spinner"></div>`;
  try{
    const snap=await getDocs(collection(db,'seasons'));
    const seasons=snap.docs.map(d=>({id:d.id,...d.data()})).filter(s=>!s.active).sort((a,b)=>b.label.localeCompare(a.label));
    let html=`<div class="section-header"><div class="section-title">Archivio</div><div style="display:flex;align-items:center;gap:8px"><span class="badge">${seasons.length}</span>${isAdmin?`<button class="btn-new-season" onclick="openNewSeasonModal()">🏆 Nuovo Anno</button>`:''}</div></div>`;
    if(!isAdmin){html+=`<div class="viewer-banner"><svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/><circle cx="12" cy="12" r="3"/></svg><span>Solo visualizzazione</span></div>`;}
    if(seasons.length===0){
      html+=`<div class="empty"><div class="empty-icon">📦</div><h3>Archivio vuoto</h3><p>Le stagioni concluse appariranno qui.</p>${isAdmin?`<button class="btn-new-season" style="margin-top:18px;display:inline-block" onclick="openNewSeasonModal()">🏆 Nuovo Anno</button>`:''}</div>`;
      c.innerHTML=html;return;
    }
    for(const s of seasons){
      const mSnap=await getDocs(query(collection(db,'seasons',s.id,'matches'),orderBy('datetime','asc')));
      const ms=mSnap.docs.map(d=>({id:d.id,...d.data()}));
      const played=ms.filter(m=>m.status==='played').length;
      const st=heronStats(ms);
      const archStats=st?`<div class="archive-stats"><span class="hstat win">✅ ${st.wins}V</span><span class="hstat loss">❌ ${st.losses}S</span><span class="hstat pts">⭐ ${st.pts}pt</span></div>`:'';
      const cardsHtml=ms.length===0?`<div style="color:var(--muted);font-size:.84rem;padding:8px 0">Nessuna partita.</div>`:ms.map(m=>buildMatchCard(m,true)).join('');
      html+=`<div class="archive-year" id="arch_${s.id}"><div class="archive-year-header" onclick="toggleArchive('${s.id}')"><div class="archive-year-label">📅 ${s.label}<span class="archive-year-meta">${ms.length} partite · ${played} giocate</span></div><span class="archive-chevron">▼</span></div><div class="archive-body">${archStats}${cardsHtml}</div></div>`;
    }
    c.innerHTML=html;
  }catch(e){c.innerHTML=`<div class="empty"><div class="empty-icon">⚠️</div><h3>Errore</h3><p>${e.message}</p></div>`;}
}

function buildTeamCard(t){
  const url=mapsUrl(t.address);
  const isHeron=t.name.trim().toLowerCase().includes('heron');

  const gymLine=t.gym?(url?`<a class="team-card-gym" href="${url}" target="_blank" rel="noopener" onclick="event.stopPropagation()"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg><span class="team-card-gym-text">${t.gym}</span><span class="map-badge">MAPS</span></a>`:`<div class="team-card-gym" style="cursor:default;pointer-events:none"><svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg><span class="team-card-gym-text">${t.gym}</span></div>`):'';
  const contact=t.contact?`<div style="font-size:.72rem;color:var(--muted);margin-top:5px">📞 ${t.contact}</div>`:'';

  return `<div class="team-card${isHeron?' team-card-heron':''}"><div class="team-card-info"><div class="team-card-name">${t.name}${isHeron?' 🦅':''}</div>${t.city?`<div class="team-card-city">🏙️ ${t.city}</div>`:''}${gymLine}${contact}</div>${actions}</div>`;
}

// ── MATCH CARD ──
function buildMatchCard(m, archived=false){
  const dt=m.datetime?new Date(m.datetime):null;
  const dateStr=dt?dt.toLocaleDateString('it-IT',{weekday:'short',day:'numeric',month:'short'}):'—';
  const timeStr=dt?dt.toLocaleTimeString('it-IT',{hour:'2-digit',minute:'2-digit'}):'';
  const homeTeam=teamById(m.homeId),awayTeam=teamById(m.awayId);
  const homeName=m.home||(homeTeam&&homeTeam.name)||'—';
  const awayName=m.away||(awayTeam&&awayTeam.name)||'—';
  const homeCity=homeTeam?.city||'';
  const awayCity=awayTeam?.city||'';
  const scoreHome=(m.status==='played'&&m.score_home!=null)?`<div class="team-score">${m.score_home}</div>`:'';
  const scoreAway=(m.status==='played'&&m.score_away!=null)?`<div class="team-score">${m.score_away}</div>`:'';
  const statusLabels={scheduled:'Programmata',played:'Giocata',cancelled:'Annullata'};
  const hT=window._st.teams.find(t=>t.name.trim().toLowerCase().includes('heron'));
  let heronBadge='';
  if(hT&&m.status==='played'){
    const ih=m.homeId===hT.id,ia=m.awayId===hT.id;
    if(ih||ia){const hs=Number(m.score_home??0),as_=Number(m.score_away??0),won=ih?hs>as_:as_>hs,lost=ih?hs<as_:as_<hs;
      if(won)heronBadge=`<span class="heron-result win">🦅 VINTA +2pt</span>`;
      else if(lost)heronBadge=`<span class="heron-result loss">🦅 PERSA 0pt</span>`;
      else heronBadge=`<span class="heron-result draw">🦅 PAREGGIO</span>`;}
  }
  const homeT4=teamById(m.homeId);
  const gymName=(homeT4?.gym)||m.location||'';
  const gymAddr=(homeT4?.address)||m.location||'';
  const url=mapsUrl(gymAddr||gymName);
  let locHtml;
  if(gymName&&url)locHtml='<a class="location-link" href="'+url+'" target="_blank" rel="noopener" onclick="event.stopPropagation()"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg><span>'+gymName+'</span><span class="map-badge">MAPS</span></a>';
  else if(gymName)locHtml='<div class="location-link" style="cursor:default"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg><span>'+gymName+'</span></div>';
  else locHtml='<span style="font-size:.75rem;color:var(--muted)">—</span>';

  // Pulsanti modifica solo admin e non archived
  const actions=(!archived&&window._st.isAdmin)?`<div class="card-actions"><button class="icon-btn" onclick="openMatchModal('${m.id}')">✏️</button><button class="icon-btn danger" onclick="deleteMatch('${m.id}')">🗑️</button></div>`:'';

  return `<div class="match-card ${m.status||'scheduled'}">
    <div class="card-top"><div class="match-date"><svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>${dateStr}${timeStr?' · '+timeStr:''}</div>
    <div class="chip-row"><span class="status-chip ${m.status||'scheduled'}">${statusLabels[m.status]||'Programmata'}</span>${heronBadge}</div></div>
    <div class="teams-row"><div class="team"><div class="team-name">${homeName}</div>${homeCity?`<div class="team-city">${homeCity}</div>`:''}${scoreHome}</div><div class="vs">VS</div><div class="team away"><div class="team-name">${awayName}</div>${awayCity?`<div class="team-city">${awayCity}</div>`:''}${scoreAway}</div></div>
    <div class="card-footer">${locHtml}
      <div style="display:flex;align-items:center;gap:7px;flex-shrink:0">
        ${(m.convocati&&m.convocati.length>0)?`<button class="conv-peek-btn" onclick="event.stopPropagation();openConvView('${m.id}')">🦅 ${m.convocati.length}</button>`:''}
        ${actions}
      </div>
    </div>
    ${m.notes?`<div style="margin-top:9px;padding-top:9px;border-top:1px solid var(--border);font-size:.74rem;color:var(--muted);line-height:1.4">📝 ${m.notes}</div>`:''}
  </div>`;
}

window.confirmNewSeason=async function(){
  if(!requireAdmin()) return;
  const btn=document.getElementById('seasonConfirmBtn');
  const label=document.getElementById('newSeasonInput').value.trim();
  if(!label){showToast('⚠️ Inserisci l\'anno');return;}
  if(!/^\d{4}-\d{2}$/.test(label)){showToast('⚠️ Formato: 20xx-xx');return;}
  btn.disabled=true;btn.textContent='⏳ Creazione...';
  try{
    const batch=writeBatch(db);
    const cur=window._st.currentSeason;
    if(cur) batch.update(doc(db,'seasons',cur.id),{active:false});
    const newId='season_'+label.replace('-','_');
    batch.set(doc(db,'seasons',newId),{label,active:true,createdAt:new Date().toISOString()});
    batch.set(doc(db,'meta','activeSeason'),{seasonId:newId,label});
    await batch.commit();
    closeOverlay('seasonOverlay');
    showToast('🏆 Campionato '+label+' avviato!');
  }catch(e){showToast('❌ '+e.message);}
  btn.disabled=false;btn.textContent='🏆 Avvia campionato';
};

// ── MATCH MODAL (admin only) ──
function populateTeamSelects(hv,av){
  ['f_home','f_away'].forEach(sid=>{
    const sel=document.getElementById(sid);if(!sel)return;
    const cur=sid==='f_home'?hv:av;
    sel.innerHTML='<option value="">— seleziona —</option>'+window._st.teams.map(t=>`<option value="${t.id}" ${t.id===cur?'selected':''}>${t.name}${t.city?' ('+t.city+')':''}</option>`).join('');
  });
  updateTeamHints();
}
function updateTeamHints(){
  const hT=teamById(document.getElementById('f_home')?.value);
  const aT=teamById(document.getElementById('f_away')?.value);
  const hh=document.getElementById('homeHint'),ah=document.getElementById('awayHint');
  if(hh)hh.textContent=hT?.gym?'🏟️ '+hT.gym:'';
  if(ah)ah.textContent=aT?.gym?'🏟️ '+aT.gym:'';
  const li=document.getElementById('f_location');
  if(li&&hT?.address&&!li.dataset.manualEdit)li.value=hT.address||hT.gym||'';
}
window.onTeamSelect=function(){updateTeamHints();};
window.onLocationInput=function(){const i=document.getElementById('f_location');if(i)i.dataset.manualEdit=i.value?'1':'';};
// ── CONVOCATI ──
// ── VISUALIZZA CONVOCATI (da card) ──
window.openConvView = function(matchId) {
  const m = window._st.matches.find(x=>x.id===matchId);
  if(!m) return;
  const dt = m.datetime ? new Date(m.datetime) : null;
  const dateStr = dt ? dt.toLocaleDateString('it-IT',{weekday:'long',day:'numeric',month:'long'}) : '';
  const homeTeam = window._st.teams.find(t=>t.id===m.homeId);
  const awayTeam = window._st.teams.find(t=>t.id===m.awayId);
  const vs = `${m.home||homeTeam?.name||'?'} vs ${m.away||awayTeam?.name||'?'}`;

  document.getElementById('convViewTitle').textContent = '🦅 Convocati Heron';
  document.getElementById('convViewMeta').innerHTML =
    `<svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
    ${dateStr ? dateStr + ' · ' : ''}${vs}`;

  const conv = m.convocati || [];
  const listEl = document.getElementById('convViewList');
  if(conv.length === 0){
    listEl.innerHTML = '<div class="conv-modal-empty">Nessun convocato inserito per questa partita.</div>';
  } else {
    listEl.innerHTML = conv.map((n,i)=>`
      <div class="conv-modal-item">
        <span class="conv-modal-num">${i+1}</span>
        <span class="conv-modal-name">${n}</span>
      </div>`).join('');
  }
  openOverlay('convViewOverlay');
};

window._convocati = []; // array of strings for current modal

window.addConvocato = function(){
  const inp = document.getElementById('convInput');
  const name = inp.value.trim();
  if(!name) return;
  if(window._convocati.map(n=>n.toLowerCase()).includes(name.toLowerCase())){
    showToast('⚠️ Già presente');
    return;
  }
  window._convocati.push(name);
  inp.value='';
  inp.focus();
  renderConvList();
};

window.removeConvocato = function(i){
  window._convocati.splice(i,1);
  renderConvList();
};

function renderConvList(){
  const el = document.getElementById('convList');
  if(!el) return;
  if(window._convocati.length===0){
    el.innerHTML='<div class="conv-empty">Nessun convocato aggiunto</div>';
    return;
  }
  el.innerHTML = window._convocati.map((n,i)=>`
    <div class="conv-item">
      <span class="conv-item-name">👤 ${n}</span>
      <button class="conv-item-del" onclick="removeConvocato(${i})" title="Rimuovi">✕</button>
    </div>`).join('');
}

function showConvSection(){
  // Show convocati section only if Heron is one of the teams
  const homeId = document.getElementById('f_home')?.value;
  const awayId = document.getElementById('f_away')?.value;
  const heronT = window._st.teams.find(t=>t.name.trim().toLowerCase().includes('heron'));
  const show = heronT && (homeId===heronT.id || awayId===heronT.id);
  const sec = document.getElementById('convSection');
  if(sec) sec.style.display = show ? 'block' : 'none';
}

// Override onTeamSelect to also update convocati visibility
const _origOnTeamSelect = window.onTeamSelect;
window.onTeamSelect = function(){
  _origOnTeamSelect && _origOnTeamSelect();
  showConvSection();
};

window.openMatchModal=function(id){
  if(!requireAdmin()) return;
  if(!window._st.currentSeason){showToast('⚠️ Crea prima un campionato');return;}
  window._st.matchId=id;
  document.getElementById('matchModalTitle').textContent=id?'Modifica Partita':'Nuova Partita';
  const li=document.getElementById('f_location');
  if(li)delete li.dataset.manualEdit;
  if(id){
    const m=window._st.matches.find(x=>x.id===id);if(!m)return;
    const dt=m.datetime?new Date(m.datetime):null;
    document.getElementById('f_date').value=dt?dt.toISOString().slice(0,10):'';
    document.getElementById('f_time').value=dt?`${String(dt.getHours()).padStart(2,'0')}:${String(dt.getMinutes()).padStart(2,'0')}`:'';
    populateTeamSelects(m.homeId||'',m.awayId||'');
    li.value=m.location||'';if(m.location)li.dataset.manualEdit='1';
    document.getElementById('f_status').value=m.status||'scheduled';
    document.getElementById('f_score_home').value=m.score_home??'';
    document.getElementById('f_score_away').value=m.score_away??'';
    document.getElementById('f_notes').value=m.notes||'';
  }else{
    document.getElementById('f_date').value=new Date().toISOString().slice(0,10);
    document.getElementById('f_time').value='18:00';
    populateTeamSelects('','');li.value='';
    document.getElementById('f_status').value='scheduled';
    ['f_score_home','f_score_away','f_notes'].forEach(i=>document.getElementById(i).value='');
  }
  // Load convocati
  window._convocati = id
    ? [...(window._st.matches.find(x=>x.id===id)?.convocati || [])]
    : [];
  renderConvList();
  showConvSection();
  toggleScore();openOverlay('matchOverlay');
};

window.openOverlay=function(id){document.getElementById(id)?.classList.add('open');};
window.closeOverlay=function(id){document.getElementById(id)?.classList.remove('open');};
window.handleOverlayClick=function(e,id){if(e.target.id===id)closeOverlay(id);};
window.toggleScore=function(){document.getElementById('scoreSection').style.display=document.getElementById('f_status').value==='played'?'block':'none';};
window.openMapsFromInput=function(){const v=document.getElementById('f_location').value.trim();if(v)window.open('https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(v),'_blank');else showToast('⚠️ Inserisci un indirizzo');};

window.saveMatch=async function(){
  if(!requireAdmin()) return;
  if(!window._st.currentSeason){showToast('⚠️ Nessun campionato attivo');return;}
  const btn=document.getElementById('matchSaveBtn');
  const homeId=document.getElementById('f_home').value;
  const awayId=document.getElementById('f_away').value;
  if(!homeId){showToast('⚠️ Seleziona squadra di casa');return;}
  if(!awayId){showToast('⚠️ Seleziona squadra ospite');return;}
  const homeTeam=teamById(homeId),awayTeam=teamById(awayId);
  const date=document.getElementById('f_date').value,time=document.getElementById('f_time').value;
  const datetime=date?new Date(`${date}T${time||'00:00'}`).toISOString():null;
  const status=document.getElementById('f_status').value;
  const data={datetime,homeId,awayId,home:homeTeam?.name||'',away:awayTeam?.name||'',location:document.getElementById('f_location').value.trim(),status,score_home:status==='played'?(parseInt(document.getElementById('f_score_home').value)||0):null,score_away:status==='played'?(parseInt(document.getElementById('f_score_away').value)||0):null,notes:document.getElementById('f_notes').value.trim(),convocati:window._convocati.filter(Boolean),updatedAt:new Date().toISOString()};
  btn.disabled=true;btn.textContent='⏳ Salvataggio...';
  try{
    const sid=window._st.currentSeason.id;
    if(window._st.matchId){await updateDoc(doc(db,'seasons',sid,'matches',window._st.matchId),data);showToast('✅ Aggiornata!');}
    else{data.createdAt=new Date().toISOString();await addDoc(collection(db,'seasons',sid,'matches'),data);showToast('✅ Partita aggiunta!');}
    closeOverlay('matchOverlay');
  }catch(e){showToast('❌ '+e.message);}
  btn.disabled=false;btn.textContent='💾 Salva Partita';
};

window.deleteAllCancelled=async function(){
  if(!requireAdmin()) return;
  const cancelled=window._st.matches.filter(m=>m.status==='cancelled');
  if(cancelled.length===0){showToast('Nessuna partita annullata');return;}
  if(!confirm(`Eliminare ${cancelled.length} partita${cancelled.length>1?'e':''} annullata${cancelled.length>1?'?':' ?'}`)) return;
  try{
    const sid=window._st.currentSeason.id;
    const batch=writeBatch(db);
    cancelled.forEach(m=>batch.delete(doc(db,'seasons',sid,'matches',m.id)));
    await batch.commit();
    showToast(`🗑️ ${cancelled.length} partita${cancelled.length>1?'e':''} eliminata${cancelled.length>1?'':'.'}`);
  }catch(e){showToast('❌ '+e.message);}
};

window.deleteMatch=async function(id){
  if(!requireAdmin()) return;
  if(!confirm('Eliminare questa partita?'))return;
  try{await deleteDoc(doc(db,'seasons',window._st.currentSeason.id,'matches',id));showToast('🗑️ Eliminata');}
  catch(e){showToast('❌ '+e.message);}
};

// ── TEAM MODAL (admin only) ──
window.openTeamModal=function(id){
  if(!requireAdmin()) return;
  window._st.teamId=id;
  document.getElementById('teamModalTitle').textContent=id?'Modifica Squadra':'Nuova Squadra';
  if(id){const t=window._st.teams.find(x=>x.id===id);if(!t)return;document.getElementById('t_name').value=t.name||'';document.getElementById('t_city').value=t.city||'';document.getElementById('t_gym').value=t.gym||'';document.getElementById('t_address').value=t.address||'';document.getElementById('t_contact').value=t.contact||'';}
  else{['t_name','t_city','t_gym','t_address','t_contact'].forEach(i=>document.getElementById(i).value='');}

window.openMapsFromTeamInput=function(){const v=document.getElementById('t_address').value.trim();if(v)window.open('https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(v),'_blank');else showToast('⚠️ Inserisci un indirizzo');};
window.saveTeam=async function(){
  if(!requireAdmin()) return;
  const btn=document.getElementById('teamSaveBtn');
  const name=document.getElementById('t_name').value.trim();
  if(!name){showToast('⚠️ Inserisci il nome');return;}

  btn.disabled=true;btn.textContent='⏳ Salvataggio...';

    else{data.createdAt=new Date().toISOString();await addDoc(collection(db,'teams'),data);showToast('✅ Squadra aggiunta!');}
    closeOverlay('teamOverlay');
  }catch(e){showToast('❌ '+e.message);}
  btn.disabled=false;btn.textContent='💾 Salva Squadra';
};
window.deleteTeam=async function(id){
  if(!requireAdmin()) return;
  if(!confirm('Eliminare questa squadra?'))return;
  try{await deleteDoc(doc(db,'teams',id));showToast('🗑️ Squadra eliminata');}
  catch(e){showToast('❌ '+e.message);}
};

// ── TOAST ──
window.showToast=function(msg){const t=document.getElementById('toast');t.textContent=msg;t.classList.add('show');setTimeout(()=>t.classList.remove('show'),2600);};

// ── SWIPE TO CLOSE MODALS ──
document.querySelectorAll('.modal').forEach(modal=>{
  let sy=0,ss=0;
  modal.addEventListener('touchstart',e=>{sy=e.touches[0].clientY;ss=modal.scrollTop;},{passive:true});
  modal.addEventListener('touchmove',e=>{const dy=e.touches[0].clientY-sy;if(dy>0&&ss<=0){modal.style.transform=`translateY(${Math.min(dy*.4,80)}px)`;modal.style.transition='none';}},{passive:true});
  modal.addEventListener('touchend',e=>{const dy=e.changedTouches[0].clientY-sy;modal.style.transition='';modal.style.transform='';if(dy>80&&ss<=0){const ov=modal.closest('.overlay');if(ov)closeOverlay(ov.id);}},{passive:true});
});
</script>
