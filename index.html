<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
  <meta name="theme-color" content="#1D428A" />
  <meta name="apple-mobile-web-app-capable" content="yes" />
  <meta name="apple-mobile-web-app-status-bar-style" content="default" />
  <meta name="apple-mobile-web-app-title" content="BasketCamp" />
  <link rel="manifest" href="manifest.json" />
  <title>BasketCamp — Campionato</title>
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:ital,wght@0,300;0,400;0,500;0,600;1,400&display=swap" rel="stylesheet" />
  <style>
    /* ── GOLDEN STATE WARRIORS PALETTE ──
       Royal Blue  #1D428A  |  Gold #FFC72C  |  White #FFFFFF */
    :root {
      --bg:         #F5F7FB;
      --surface:    #FFFFFF;
      --surface2:   #EEF1F8;
      --border:     #D8DEF0;
      --gold:       #FFC72C;
      --gold-dim:   #E6A800;
      --gold-glow:  rgba(255,199,44,0.18);
      --blue:       #1D428A;
      --blue-light: #2550A8;
      --blue-glow:  rgba(29,66,138,0.10);
      --text:       #0E1A36;
      --muted:      #6B7A99;
      --red:        #D93025;
      --green:      #1A8745;
      --radius:     14px;
    }
    * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
    html, body { height: 100%; background: var(--bg); color: var(--text); font-family: 'DM Sans', sans-serif; overflow-x: hidden; }

    /* ── HEADER ── */
    header {
      position: sticky; top: 0; z-index: 100;
      background: var(--blue);
      border-bottom: 3px solid var(--gold);
      padding: env(safe-area-inset-top,0) 0 0;
      box-shadow: 0 2px 16px rgba(29,66,138,.22);
    }
    .header-inner { display: flex; align-items: center; justify-content: space-between; padding: 13px 18px; }
    .logo { font-family: 'Bebas Neue', sans-serif; font-size: 1.75rem; letter-spacing: 2px; color: var(--gold); }
    .logo span { color: #fff; }
    nav { display: flex; gap: 3px; background: rgba(255,255,255,.12); border-radius: 12px; padding: 4px; border: 1px solid rgba(255,255,255,.2); }
    .nav-btn {
      padding: 6px 13px; border-radius: 8px; border: none; cursor: pointer;
      font-family: 'DM Sans', sans-serif; font-size: .8rem; font-weight: 500;
      background: transparent; color: rgba(255,255,255,.65); transition: all .2s; white-space: nowrap;
    }
    .nav-btn.active { background: var(--gold); color: var(--blue); font-weight: 700; }

    /* ── MAIN ── */
    main { padding: 18px; max-width: 700px; margin: 0 auto; padding-bottom: 110px; }

    /* ── SECTION HEADER ── */
    .section-header { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
    .section-title { font-family: 'Bebas Neue', sans-serif; font-size: 1.55rem; letter-spacing: 1px; color: var(--blue); }
    .badge { background: var(--gold-glow); color: var(--blue); border: 1px solid var(--gold-dim); border-radius: 20px; padding: 2px 10px; font-size: .74rem; font-weight: 700; }

    /* ── FAB ── */
    .fab {
      position: fixed; bottom: calc(26px + env(safe-area-inset-bottom,0)); right: 18px; z-index: 200;
      width: 56px; height: 56px; border-radius: 50%;
      background: var(--gold); color: var(--blue); border: none; cursor: pointer;
      font-size: 1.6rem; font-weight: 700;
      box-shadow: 0 4px 22px rgba(255,199,44,.55);
      transition: transform .15s; display: flex; align-items: center; justify-content: center;
    }
    .fab:active { transform: scale(.92); }

    /* ── MATCH CARD ── */
    .match-card {
      background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
      padding: 16px 18px; margin-bottom: 11px; position: relative; overflow: hidden;
      animation: fadeUp .28s ease both; box-shadow: 0 2px 8px rgba(29,66,138,.06);
    }
    .match-card::before { content:''; position:absolute; left:0; top:0; bottom:0; width:4px; background:var(--gold); }
    .match-card.played::before  { background: var(--green); }
    .match-card.cancelled::before { background: var(--red); }
    @keyframes fadeUp { from{opacity:0;transform:translateY(11px)} to{opacity:1;transform:translateY(0)} }

    .card-top { display:flex; align-items:center; justify-content:space-between; margin-bottom:12px; }
    .match-date { font-size:.77rem; color:var(--muted); display:flex; align-items:center; gap:5px; }
    .status-chip { font-size:.67rem; font-weight:700; padding:3px 10px; border-radius:20px; letter-spacing:.5px; text-transform:uppercase; }
    .status-chip.scheduled { background:var(--gold-glow); color:var(--blue); border:1px solid var(--gold-dim); }
    .status-chip.played    { background:rgba(26,135,69,.1); color:var(--green); border:1px solid rgba(26,135,69,.3); }
    .status-chip.cancelled { background:rgba(217,48,37,.1); color:var(--red); border:1px solid rgba(217,48,37,.3); }

    .teams-row { display:grid; grid-template-columns:1fr auto 1fr; align-items:center; gap:8px; }
    .team { display:flex; flex-direction:column; }
    .team.away { align-items:flex-end; }
    .team-name { font-family:'Bebas Neue',sans-serif; font-size:1.12rem; letter-spacing:.5px; color:var(--blue); }
    .team-city { font-size:.72rem; color:var(--muted); }
    .team-score { font-size:1.45rem; font-weight:700; color:var(--gold-dim); }
    .vs { font-family:'Bebas Neue',sans-serif; font-size:.95rem; color:var(--muted); text-align:center; }

    .card-footer { display:flex; align-items:center; justify-content:space-between; margin-top:12px; padding-top:11px; border-top:1px solid var(--border); gap:8px; }
    .location-link {
      font-size:.77rem; color:var(--blue); display:flex; align-items:center; gap:5px;
      text-decoration:none; flex:1; overflow:hidden; min-width:0;
      transition: color .15s;
    }
    .location-link:hover { color: var(--gold-dim); }
    .location-link span { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .location-link .map-badge {
      flex-shrink:0; background:var(--blue); color:#fff; font-size:.62rem; font-weight:700;
      padding:2px 6px; border-radius:4px; letter-spacing:.3px;
    }
    .location-link:hover .map-badge { background: var(--gold-dim); }
    .card-actions { display:flex; gap:7px; flex-shrink:0; }
    .icon-btn {
      width:33px; height:33px; border-radius:8px; border:1px solid var(--border);
      background:var(--surface2); color:var(--muted); cursor:pointer;
      display:flex; align-items:center; justify-content:center; font-size:.84rem; transition:all .15s;
    }
    .icon-btn:hover { border-color:var(--blue); color:var(--blue); background:var(--blue-glow); }
    .icon-btn.danger:hover { border-color:var(--red); color:var(--red); background:rgba(217,48,37,.08); }

    /* ── TEAM CARD ── */
    .team-card {
      background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius);
      padding: 16px 18px; margin-bottom: 11px; position: relative; overflow: hidden;
      animation: fadeUp .28s ease both; box-shadow: 0 2px 8px rgba(29,66,138,.06);
      display: flex; align-items: center; justify-content: space-between; gap: 12px;
    }
    .team-card::before { content:''; position:absolute; left:0; top:0; bottom:0; width:4px; background:var(--blue); }
    .team-card-info { flex:1; min-width:0; }
    .team-card-name { font-family:'Bebas Neue',sans-serif; font-size:1.15rem; letter-spacing:.5px; color:var(--blue); }
    .team-card-city { font-size:.78rem; color:var(--muted); margin-top:1px; }
    .team-card-gym {
      display:flex; align-items:center; gap:5px; margin-top:7px;
      font-size:.77rem; color:var(--blue); text-decoration:none; transition:color .15s;
    }
    .team-card-gym:hover { color: var(--gold-dim); }
    .team-card-gym .map-badge { flex-shrink:0; background:var(--blue); color:#fff; font-size:.62rem; font-weight:700; padding:2px 6px; border-radius:4px; }
    .team-card-gym:hover .map-badge { background: var(--gold-dim); }
    .team-card-gym-text { overflow:hidden; text-overflow:ellipsis; white-space:nowrap; }
    .team-card-actions { display:flex; gap:7px; flex-shrink:0; }

    /* ── EMPTY ── */
    .empty { text-align:center; padding:56px 20px; color:var(--muted); }
    .empty-icon { font-size:3.2rem; margin-bottom:12px; }
    .empty h3 { font-family:'Bebas Neue',sans-serif; font-size:1.35rem; color:var(--blue); margin-bottom:8px; }
    .empty p { font-size:.87rem; line-height:1.5; }

    /* ── MODAL ── */
    .overlay {
      position:fixed; inset:0; z-index:300;
      background:rgba(14,26,54,.6); backdrop-filter:blur(6px);
      display:flex; align-items:flex-end; justify-content:center;
      opacity:0; pointer-events:none; transition:opacity .25s;
    }
    .overlay.open { opacity:1; pointer-events:all; }
    .modal {
      background:var(--surface); border:1px solid var(--border); border-top:4px solid var(--gold);
      border-radius:var(--radius) var(--radius) 0 0;
      width:100%; max-width:700px; padding:22px 18px;
      padding-bottom:calc(30px + env(safe-area-inset-bottom,0));
      transform:translateY(40px); transition:transform .3s cubic-bezier(.34,1.56,.64,1);
      max-height:92vh; overflow-y:auto;
    }
    .overlay.open .modal { transform:translateY(0); }
    .modal-title { font-family:'Bebas Neue',sans-serif; font-size:1.45rem; letter-spacing:1px; color:var(--blue); margin-bottom:20px; display:flex; align-items:center; justify-content:space-between; }
    .close-btn { background:var(--surface2); border:1px solid var(--border); color:var(--muted); width:33px; height:33px; border-radius:8px; cursor:pointer; font-size:1rem; display:flex; align-items:center; justify-content:center; }

    .form-group { margin-bottom:14px; }
    .form-group label { display:block; font-size:.79rem; color:var(--blue); margin-bottom:5px; font-weight:600; letter-spacing:.3px; }
    .form-group input, .form-group select, .form-group textarea {
      width:100%; background:var(--bg); border:1px solid var(--border);
      border-radius:10px; padding:11px 13px; color:var(--text);
      font-family:'DM Sans',sans-serif; font-size:.88rem; outline:none; transition:border-color .2s, box-shadow .2s;
      -webkit-appearance:none;
    }
    .form-group input:focus, .form-group select:focus, .form-group textarea:focus {
      border-color:var(--blue); box-shadow:0 0 0 3px var(--blue-glow);
    }
    .form-row { display:grid; grid-template-columns:1fr 1fr; gap:11px; }
    .score-row { display:grid; grid-template-columns:1fr 22px 1fr; align-items:center; gap:9px; }
    .score-sep { font-family:'Bebas Neue',sans-serif; font-size:1.1rem; color:var(--muted); text-align:center; }

    /* location input with map icon button */
    .location-input-wrap { position:relative; }
    .location-input-wrap input { padding-right:42px; }
    .map-open-btn {
      position:absolute; right:8px; top:50%; transform:translateY(-50%);
      width:28px; height:28px; border-radius:7px; border:none;
      background:var(--blue); color:#fff; cursor:pointer; font-size:.85rem;
      display:flex; align-items:center; justify-content:center; transition:background .15s;
    }
    .map-open-btn:hover { background:var(--blue-light); }

    .btn-primary {
      width:100%; padding:13px; border-radius:12px; border:none;
      background:var(--blue); color:#fff; font-family:'DM Sans',sans-serif;
      font-size:.93rem; font-weight:600; cursor:pointer; transition:opacity .15s, background .15s; margin-top:8px;
    }
    .btn-primary:hover { background:var(--blue-light); }
    .btn-primary:active { opacity:.85; }
    .btn-primary:disabled { opacity:.4; cursor:not-allowed; }

    /* ── FILTERS ── */
    .filters { display:flex; gap:7px; margin-bottom:16px; overflow-x:auto; padding-bottom:4px; scrollbar-width:none; }
    .filters::-webkit-scrollbar { display:none; }
    .filter-chip {
      flex-shrink:0; padding:6px 13px; border-radius:20px; border:1px solid var(--border);
      background:var(--surface); color:var(--muted); font-size:.79rem; font-weight:500; cursor:pointer;
      transition:all .15s; font-family:'DM Sans',sans-serif; box-shadow:0 1px 4px rgba(29,66,138,.05);
    }
    .filter-chip.active { border-color:var(--blue); background:var(--blue); color:#fff; font-weight:600; }

    /* ── CONFIG ── */
    .config-note { background:var(--gold-glow); border:1px solid var(--gold-dim); border-radius:10px; padding:13px; font-size:.81rem; color:#6B4800; margin-bottom:16px; line-height:1.6; }
    .config-note strong { color:var(--blue); }
    .config-steps { list-style:none; counter-reset:steps; margin-bottom:16px; }
    .config-steps li { counter-increment:steps; display:flex; gap:10px; align-items:flex-start; margin-bottom:10px; font-size:.85rem; line-height:1.5; color:var(--muted); }
    .config-steps li::before { content:counter(steps); min-width:22px; height:22px; border-radius:50%; background:var(--blue); color:#fff; font-size:.7rem; font-weight:700; display:flex; align-items:center; justify-content:center; flex-shrink:0; margin-top:1px; }
    .config-steps li strong { color:var(--text); }

    /* ── TOAST ── */
    .toast { position:fixed; bottom:88px; left:50%; transform:translateX(-50%) translateY(20px); background:var(--blue); border:2px solid var(--gold); border-radius:10px; padding:10px 20px; font-size:.84rem; color:#fff; opacity:0; transition:all .3s; z-index:500; white-space:nowrap; box-shadow:0 4px 20px rgba(29,66,138,.3); pointer-events:none; }
    .toast.show { opacity:1; transform:translateX(-50%) translateY(0); }

    /* ── SPINNER ── */
    .spinner { width:34px; height:34px; border:3px solid var(--border); border-top-color:var(--blue); border-radius:50%; animation:spin .7s linear infinite; margin:48px auto; }
    @keyframes spin { to{transform:rotate(360deg)} }


    /* ── HERON STATS ── */
    .team-card-heron { border-color: #1D428A; box-shadow: 0 2px 12px rgba(29,66,138,.14); }
    .team-card-heron::before { background: var(--gold); }
    .heron-stats { display:flex; gap:7px; margin-top:8px; flex-wrap:wrap; }
    .hstat { font-size:.74rem; font-weight:700; padding:3px 10px; border-radius:20px; letter-spacing:.3px; }
    .hstat.win  { background:rgba(26,135,69,.12); color:var(--green); border:1px solid rgba(26,135,69,.3); }
    .hstat.loss { background:rgba(217,48,37,.10); color:var(--red);   border:1px solid rgba(217,48,37,.3); }
    .hstat.pts  { background:var(--gold-glow); color:var(--blue); border:1px solid var(--gold-dim); }

    /* ── MATCH CARD: Heron result badge ── */
    .heron-result { display:inline-flex; align-items:center; gap:4px; font-size:.68rem; font-weight:700; padding:2px 8px; border-radius:12px; margin-left:6px; letter-spacing:.3px; }
    .heron-result.win  { background:rgba(26,135,69,.12); color:var(--green); border:1px solid rgba(26,135,69,.3); }
    .heron-result.loss { background:rgba(217,48,37,.10); color:var(--red);   border:1px solid rgba(217,48,37,.3); }
    .heron-result.draw { background:var(--gold-glow);    color:var(--blue);  border:1px solid var(--gold-dim); }
    select option { background:var(--surface); color:var(--text); }
    textarea { resize:vertical; min-height:66px; }

    /* select team hint */
    .select-hint { font-size:.74rem; color:var(--muted); margin-top:4px; }
  </style>
</head>
<body>

<header>
  <div class="header-inner">
    <div class="logo">Basket<span>Camp</span></div>
    <nav>
      <button class="nav-btn active" id="navList"   onclick="setView('list')">🏀 Partite</button>
      <button class="nav-btn"        id="navTeams"  onclick="setView('teams')">👕 Squadre</button>
<!-- config nav rimosso: credenziali hardcoded -->
    </nav>
  </div>
</header>

<main id="app"><div class="spinner"></div></main>

<button class="fab" id="fabBtn" style="display:none" title="Aggiungi">＋</button>

<!-- ══ MATCH MODAL ══ -->
<div class="overlay" id="matchOverlay" onclick="handleOverlayClick(event,'matchOverlay')">
  <div class="modal">
    <div class="modal-title">
      <span id="matchModalTitle">Nuova Partita</span>
      <button class="close-btn" onclick="closeOverlay('matchOverlay')">✕</button>
    </div>

    <div class="form-row">
      <div class="form-group">
        <label>📅 Data</label>
        <input type="date" id="f_date" />
      </div>
      <div class="form-group">
        <label>🕐 Ora</label>
        <input type="time" id="f_time" />
      </div>
    </div>

    <div class="form-row">
      <div class="form-group">
        <label>🏠 Squadra Casa</label>
        <select id="f_home" onchange="onTeamSelect()">
          <option value="">— seleziona —</option>
        </select>
        <div class="select-hint" id="homeHint"></div>
      </div>
      <div class="form-group">
        <label>✈️ Squadra Ospite</label>
        <select id="f_away" onchange="onTeamSelect()">
          <option value="">— seleziona —</option>
        </select>
        <div class="select-hint" id="awayHint"></div>
      </div>
    </div>

    <!-- campo palestra auto-compilato o manuale -->
    <div class="form-group">
      <label>📍 Palazzetto / Campo</label>
      <div class="location-input-wrap">
        <input type="text" id="f_location" placeholder="Inserisci indirizzo palazzetto" maxlength="120" oninput="onLocationInput()" />
        <button class="map-open-btn" onclick="openMapsFromInput()" title="Apri su Google Maps">🗺️</button>
      </div>
    </div>

    <div class="form-group">
      <label>Stato partita</label>
      <select id="f_status" onchange="toggleScore()">
        <option value="scheduled">🟠 Programmata</option>
        <option value="played">🟢 Giocata</option>
        <option value="cancelled">🔴 Annullata</option>
      </select>
    </div>

    <div id="scoreSection" style="display:none">
      <div class="form-group">
        <label>🏆 Risultato finale</label>
        <div class="score-row">
          <input type="number" id="f_score_home" placeholder="0" min="0" max="999" />
          <div class="score-sep">—</div>
          <input type="number" id="f_score_away" placeholder="0" min="0" max="999" />
        </div>
      </div>
    </div>

    <div class="form-group">
      <label>📝 Note (opzionale)</label>
      <textarea id="f_notes" placeholder="Eventuali info aggiuntive..."></textarea>
    </div>

    <button class="btn-primary" id="matchSaveBtn" onclick="saveMatch()">💾 Salva Partita</button>
  </div>
</div>

<!-- ══ TEAM MODAL ══ -->
<div class="overlay" id="teamOverlay" onclick="handleOverlayClick(event,'teamOverlay')">
  <div class="modal">
    <div class="modal-title">
      <span id="teamModalTitle">Nuova Squadra</span>
      <button class="close-btn" onclick="closeOverlay('teamOverlay')">✕</button>
    </div>

    <div class="form-group">
      <label>👕 Nome Squadra *</label>
      <input type="text" id="t_name" placeholder="es. Warriors Roma" maxlength="50" />
    </div>

    <div class="form-group">
      <label>🏙️ Città</label>
      <input type="text" id="t_city" placeholder="es. Roma" maxlength="40" />
    </div>

    <div class="form-group">
      <label>🏟️ Nome Palazzetto / Palestra</label>
      <input type="text" id="t_gym" placeholder="es. PalaSport Roma" maxlength="80" />
    </div>

    <div class="form-group">
      <label>📍 Indirizzo Palestra (per Google Maps)</label>
      <div class="location-input-wrap">
        <input type="text" id="t_address" placeholder="es. Via Roma 1, Roma" maxlength="120" />
        <button class="map-open-btn" onclick="openMapsFromTeamInput()" title="Apri su Google Maps">🗺️</button>
      </div>
    </div>

    <div class="form-group">
      <label>📞 Contatto (opzionale)</label>
      <input type="text" id="t_contact" placeholder="es. 333 1234567" maxlength="40" />
    </div>

    <button class="btn-primary" id="teamSaveBtn" onclick="saveTeam()">💾 Salva Squadra</button>
  </div>
</div>

<!-- TOAST -->
<div class="toast" id="toast"></div>

<script>
  if ('serviceWorker' in navigator) {
    window.addEventListener('load', () => {
      navigator.serviceWorker.register('./sw.js').catch(() => {});
    });
  }
</script>

<script type="module">
import { initializeApp, getApps } from "https://www.gstatic.com/firebasejs/10.12.0/firebase-app.js";
import {
  getFirestore, collection, addDoc, doc, updateDoc, deleteDoc,
  onSnapshot, query, orderBy
} from "https://www.gstatic.com/firebasejs/10.12.0/firebase-firestore.js";

// ══════════════════════════════════════════════
//  STATE
// ══════════════════════════════════════════════
let db = null, unsubMatches = null, unsubTeams = null;
window._st = { matches:[], teams:[], matchId:null, teamId:null, filter:'all', view:'list' };

// ══════════════════════════════════════════════
//  FIREBASE
// ══════════════════════════════════════════════
// ── CONFIGURAZIONE FIREBASE (hardcoded) ──
const FIREBASE_CONFIG = {
  apiKey:            "AIzaSyCp4CwfMk23V3ygos2Q9-YgnOscaNuY0mo",
  authDomain:        "heronbasket-f30ad.firebaseapp.com",
  projectId:         "heronbasket-f30ad",
  storageBucket:     "heronbasket-f30ad.firebasestorage.app",
  messagingSenderId: "532698135710",
  appId:             "1:532698135710:web:24c5ad9ad60747855b8f8f"
};

function getConfig() { return FIREBASE_CONFIG; }
function isConfigured() { return true; }

function initFirebase() {
  try {
    const apps = getApps();
    const app = apps.length ? apps[0] : initializeApp(FIREBASE_CONFIG);
    db = getFirestore(app); return true;
  } catch(e) { console.error(e); return false; }
}

function startListeners() {
  if (!db) return;
  if (unsubMatches) unsubMatches();
  if (unsubTeams)   unsubTeams();

  unsubTeams = onSnapshot(query(collection(db,'teams'), orderBy('name','asc')), snap => {
    window._st.teams = snap.docs.map(d=>({id:d.id,...d.data()}));
    renderApp();
  }, err => console.error(err));

  unsubMatches = onSnapshot(query(collection(db,'matches'), orderBy('datetime','asc')), snap => {
    window._st.matches = snap.docs.map(d=>({id:d.id,...d.data()}));
    renderApp();
  }, err => { showToast('⚠️ Errore Firebase'); renderApp(); });
}

window.setView = function(v) {
  window._st.view = v;
  ['navList','navTeams'].forEach(id => document.getElementById(id).classList.remove('active'));
  const map = {list:'navList',teams:'navTeams'};
  if (map[v]) document.getElementById(map[v]).classList.add('active');
  const fabBtn = document.getElementById('fabBtn');
  // Firebase sempre attivo
  fabBtn.style.display = (v==='list'||v==='teams') ? 'flex' : 'none';
  fabBtn.onclick = v==='teams' ? ()=>openTeamModal(null) : ()=>openMatchModal(null);
  fabBtn.title   = v==='teams' ? 'Aggiungi squadra' : 'Aggiungi partita';
  renderApp();
};

function renderApp() {
  const c = document.getElementById('app');
  const v = window._st.view;
  // Firebase sempre configurato (credenziali hardcoded)
  if (v==='teams')  { renderTeams(c); return; }
  renderList(c);
}

function renderTeams(c) {
  const teams = window._st.teams;
  let html = `<div class="section-header"><div class="section-title">Squadre</div><span class="badge">${teams.length}</span></div>`;
  if (teams.length === 0) {
    html += `<div class="empty"><div class="empty-icon">👕</div><h3>Nessuna squadra</h3><p>Premi <strong>＋</strong> per aggiungere la prima squadra al campionato.</p></div>`;
  } else {
    teams.forEach(t => { html += buildTeamCard(t); });
  }
  c.innerHTML = html;
}

function mapsUrl(address) {
  if (!address) return null;
  return 'https://www.google.com/maps/search/?api=1&query=' + encodeURIComponent(address);
}

function buildTeamCard(t) {
  const url = mapsUrl(t.address);
  // Solo nome palestra cliccabile (apre Maps se ha indirizzo)
  const gymLine = t.gym
    ? (url
        ? `<a class="team-card-gym" href="${url}" target="_blank" rel="noopener" onclick="event.stopPropagation()">
             <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>
             <span class="team-card-gym-text">${t.gym}</span>
             <span class="map-badge">MAPS</span>
           </a>`
        : `<div class="team-card-gym" style="cursor:default;pointer-events:none">
             <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>
             <span class="team-card-gym-text">${t.gym}</span>
           </div>`)
    : (url
        ? `<a class="team-card-gym" href="${url}" target="_blank" rel="noopener" onclick="event.stopPropagation()">
             <svg width="12" height="12" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>
             <span class="team-card-gym-text">Vedi su Maps</span>
             <span class="map-badge">MAPS</span>
           </a>`
        : '');

  const contact = t.contact ? `<div style="font-size:.74rem;color:var(--muted);margin-top:5px">📞 ${t.contact}</div>` : '';

  const isHeron = t.name.trim().toLowerCase().includes('heron');

  return `
    <div class="team-card${isHeron?' team-card-heron':''}">
      <div class="team-card-info">
        <div class="team-card-name">${t.name}${isHeron?' 🦅':''}</div>
        ${t.city ? `<div class="team-card-city">🏙️ ${t.city}</div>` : ''}
        ${gymLine}
        ${contact}
      </div>
      <div class="team-card-actions">
        <button class="icon-btn" onclick="openTeamModal('${t.id}')" title="Modifica">✏️</button>
        <button class="icon-btn danger" onclick="deleteTeam('${t.id}')" title="Elimina">🗑️</button>
      </div>
    </div>
  `;
}

function renderList(c) {
  const filterMap = {all:'Tutte',scheduled:'Programmate',played:'Giocate',cancelled:'Annullate'};
  let matches = window._st.matches;
  if (window._st.filter!=='all') matches = matches.filter(m=>m.status===window._st.filter);

  // Calcola statistiche Heron
  const heronTeam = window._st.teams.find(t => t.name.trim().toLowerCase().includes('heron'));
  let heronStatsHtml = '';
  if (heronTeam) {
    const played = window._st.matches.filter(m => m.status==='played' && (m.homeId===heronTeam.id || m.awayId===heronTeam.id));
    let wins=0, losses=0;
    played.forEach(m => {
      const isHome = m.homeId===heronTeam.id;
      const hs=Number(m.score_home??0), as_=Number(m.score_away??0);
      if (isHome ? hs>as_ : as_>hs) wins++; else losses++;
    });
    const pts = wins*2;
    heronStatsHtml = `
      <div class="heron-stats" style="margin-bottom:16px">
        <span class="hstat win">✅ ${wins} Vinte</span>
        <span class="hstat loss">❌ ${losses} Perse</span>
        <span class="hstat pts">⭐ ${pts} pt</span>
      </div>`;
  }

  let html = `
    <div class="section-header"><div class="section-title">Partite</div><span class="badge">${matches.length}</span></div>
    ${heronStatsHtml}
    <div class="filters">
      ${Object.entries(filterMap).map(([k,v])=>
        `<button class="filter-chip ${window._st.filter===k?'active':''}" onclick="setFilter('${k}')">${v}</button>`
      ).join('')}
    </div>
  `;

  if (matches.length===0) {
    html += `<div class="empty"><div class="empty-icon">🏀</div>
      <h3>${window._st.filter==='all'?'Nessuna partita':'Nessun risultato'}</h3>
      <p>${window._st.filter==='all'?'Premi <strong>＋</strong> per aggiungere la prima partita.':'Nessuna partita con questo filtro.'}</p></div>`;
  } else {
    matches.forEach(m => { html += buildMatchCard(m); });
  }
  c.innerHTML = html;
}

window.setFilter = function(f) { window._st.filter=f; renderApp(); };

function teamById(id) { return window._st.teams.find(t=>t.id===id)||null; }

function buildMatchCard(m) {
  const dt = m.datetime ? new Date(m.datetime) : null;
  const dateStr = dt ? dt.toLocaleDateString('it-IT',{weekday:'short',day:'numeric',month:'short'}) : '—';
  const timeStr = dt ? dt.toLocaleTimeString('it-IT',{hour:'2-digit',minute:'2-digit'}) : '';

  const homeTeam = teamById(m.homeId);
  const awayTeam = teamById(m.awayId);
  const homeName = m.home || (homeTeam&&homeTeam.name) || '—';
  const awayName = m.away || (awayTeam&&awayTeam.name) || '—';
  const homeCity = homeTeam&&homeTeam.city ? homeTeam.city : '';
  const awayCity = awayTeam&&awayTeam.city ? awayTeam.city : '';

  const scoreHome = (m.status==='played'&&m.score_home!=null) ? `<div class="team-score">${m.score_home}</div>` : '';
  const scoreAway = (m.status==='played'&&m.score_away!=null) ? `<div class="team-score">${m.score_away}</div>` : '';

  const statusLabels = {scheduled:'Programmata',played:'Giocata',cancelled:'Annullata'};

  // Heron result badge
  const heronTeam = window._st.teams.find(t => t.name.trim().toLowerCase().includes('heron'));
  let heronBadge = '';
  if (heronTeam && m.status==='played') {
    const isHome = m.homeId===heronTeam.id;
    const isAway = m.awayId===heronTeam.id;
    if (isHome||isAway) {
      const hs=Number(m.score_home??0), as_=Number(m.score_away??0);
      const won = isHome ? hs>as_ : as_>hs;
      const lost = isHome ? hs<as_ : as_<hs;
      if (won)       heronBadge = `<span class="heron-result win">🦅 VINTA +2pt</span>`;
      else if (lost) heronBadge = `<span class="heron-result loss">🦅 PERSA 0pt</span>`;
      else           heronBadge = `<span class="heron-result draw">🦅 PAREGGIO</span>`;
    }
  }

  // Mostra solo nome palestra (cliccabile con indirizzo su Maps)
  const locText = m.location || '';
  const homeT4loc = teamById(m.homeId);
  const gymName = (homeT4loc && homeT4loc.gym) ? homeT4loc.gym : locText;
  const gymAddr = (homeT4loc && homeT4loc.address) ? homeT4loc.address : locText;
  const url = mapsUrl(gymAddr || gymName);
  let locHtml;
  if (gymName && url) {
    locHtml = '<a class="location-link" href="' + url + '" target="_blank" rel="noopener" onclick="event.stopPropagation()">'
      + '<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>'
      + '<span>' + gymName + '</span>'
      + '<span class="map-badge">MAPS</span>'
      + '</a>';
  } else if (gymName) {
    locHtml = '<div class="location-link" style="cursor:default">'
      + '<svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M21 10c0 7-9 13-9 13s-9-6-9-13a9 9 0 0 1 18 0z"/><circle cx="12" cy="10" r="3"/></svg>'
      + '<span>' + gymName + '</span>'
      + '</div>';
  } else {
    locHtml = '<span style="font-size:.77rem;color:var(--muted)">—</span>';
  }

  return `
    <div class="match-card ${m.status||'scheduled'}">
      <div class="card-top">
        <div class="match-date">
          <svg width="11" height="11" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="4" width="18" height="18" rx="2"/><line x1="16" y1="2" x2="16" y2="6"/><line x1="8" y1="2" x2="8" y2="6"/><line x1="3" y1="10" x2="21" y2="10"/></svg>
          ${dateStr}${timeStr?' · '+timeStr:''}
        </div>
        <div style="display:flex;align-items:center;gap:5px;flex-wrap:wrap;justify-content:flex-end"><span class="status-chip ${m.status||'scheduled'}">${statusLabels[m.status]||'Programmata'}</span>${heronBadge}</div>
      </div>
      <div class="teams-row">
        <div class="team">
          <div class="team-name">${homeName}</div>
          ${homeCity?`<div class="team-city">${homeCity}</div>`:''}
          ${scoreHome}
        </div>
        <div class="vs">VS</div>
        <div class="team away">
          <div class="team-name">${awayName}</div>
          ${awayCity?`<div class="team-city">${awayCity}</div>`:''}
          ${scoreAway}
        </div>
      </div>
      <div class="card-footer">
        ${locHtml}
        <div class="card-actions">
          <button class="icon-btn" onclick="openMatchModal('${m.id}')" title="Modifica">✏️</button>
          <button class="icon-btn danger" onclick="deleteMatch('${m.id}')" title="Elimina">🗑️</button>
        </div>
      </div>
      ${m.notes?`<div style="margin-top:10px;padding-top:10px;border-top:1px solid var(--border);font-size:.77rem;color:var(--muted)">📝 ${m.notes}</div>`:''}
    </div>
  `;
}

function populateTeamSelects(homeVal, awayVal) {
  const teams = window._st.teams;
  ['f_home','f_away'].forEach(selId => {
    const sel = document.getElementById(selId);
    if (!sel) return;
    const cur = selId==='f_home' ? homeVal : awayVal;
    sel.innerHTML = '<option value="">— seleziona squadra —</option>' +
      teams.map(t=>`<option value="${t.id}" ${t.id===cur?'selected':''}>${t.name}${t.city?' ('+t.city+')':''}</option>`).join('');
  });
  updateTeamHints();
}

function updateTeamHints() {
  const homeId = document.getElementById('f_home')?.value;
  const awayId = document.getElementById('f_away')?.value;
  const homeT = teamById(homeId);
  const awayT = teamById(awayId);

  const homeHint = document.getElementById('homeHint');
  const awayHint = document.getElementById('awayHint');
  if (homeHint) homeHint.textContent = homeT&&homeT.gym ? '🏟️ '+homeT.gym : '';
  if (awayHint) awayHint.textContent = awayT&&awayT.gym ? '🏟️ '+awayT.gym : '';

  // Auto-fill location with home team's gym address
  const locInput = document.getElementById('f_location');
  if (locInput && homeT && homeT.address && !locInput.dataset.manualEdit) {
    locInput.value = homeT.address || homeT.gym || '';
  }
}

window.onTeamSelect = function() { updateTeamHints(); };

window.onLocationInput = function() {
  const inp = document.getElementById('f_location');
  if (inp) inp.dataset.manualEdit = inp.value ? '1' : '';
};

window.openMatchModal = function(id) {
  window._st.matchId = id;
  document.getElementById('matchModalTitle').textContent = id ? 'Modifica Partita' : 'Nuova Partita';
  const locInput = document.getElementById('f_location');
  if (locInput) delete locInput.dataset.manualEdit;

  if (id) {
    const m = window._st.matches.find(x=>x.id===id);
    if (!m) return;
    const dt = m.datetime ? new Date(m.datetime) : null;
    document.getElementById('f_date').value = dt ? dt.toISOString().slice(0,10) : '';
    document.getElementById('f_time').value = dt ? `${String(dt.getHours()).padStart(2,'0')}:${String(dt.getMinutes()).padStart(2,'0')}` : '';
    populateTeamSelects(m.homeId||'', m.awayId||'');
    locInput.value = m.location||'';
    if (m.location) locInput.dataset.manualEdit = '1';
    document.getElementById('f_status').value = m.status||'scheduled';
    document.getElementById('f_score_home').value = m.score_home??'';
    document.getElementById('f_score_away').value = m.score_away??'';
    document.getElementById('f_notes').value = m.notes||'';
  } else {
    document.getElementById('f_date').value = new Date().toISOString().slice(0,10);
    document.getElementById('f_time').value = '18:00';
    populateTeamSelects('','');
    locInput.value = '';
    document.getElementById('f_status').value = 'scheduled';
    ['f_score_home','f_score_away','f_notes'].forEach(i=>document.getElementById(i).value='');
  }
  toggleScore();
  document.getElementById('matchOverlay').classList.add('open');
};

window.closeOverlay = function(id) { document.getElementById(id).classList.remove('open'); };
window.handleOverlayClick = function(e, id) { if (e.target.id===id) closeOverlay(id); };
window.toggleScore = function() {
  const s = document.getElementById('f_status').value;
  document.getElementById('scoreSection').style.display = s==='played'?'block':'none';
};

window.openMapsFromInput = function() {
  const v = document.getElementById('f_location').value.trim();
  if (v) window.open('https://www.google.com/maps/search/?api=1&query='+encodeURIComponent(v),'_blank');
  else showToast('⚠️ Inserisci prima un indirizzo');
};

window.saveMatch = async function() {
  const btn = document.getElementById('matchSaveBtn');
  const homeId = document.getElementById('f_home').value;
  const awayId = document.getElementById('f_away').value;
  const homeTeam = teamById(homeId);
  const awayTeam = teamById(awayId);
  const homeName = homeTeam ? homeTeam.name : document.getElementById('f_home').options[document.getElementById('f_home').selectedIndex]?.text || '';
  const awayName = awayTeam ? awayTeam.name : document.getElementById('f_away').options[document.getElementById('f_away').selectedIndex]?.text || '';

  if (!homeId && !homeName.trim()) { showToast('⚠️ Seleziona la squadra di casa'); return; }
  if (!awayId && !awayName.trim()) { showToast('⚠️ Seleziona la squadra ospite'); return; }

  const date = document.getElementById('f_date').value;
  const time = document.getElementById('f_time').value;
  const datetime = date ? new Date(`${date}T${time||'00:00'}`).toISOString() : null;
  const status = document.getElementById('f_status').value;

  const data = {
    datetime,
    homeId: homeId||null,
    awayId: awayId||null,
    home: homeTeam ? homeTeam.name : homeName,
    away: awayTeam ? awayTeam.name : awayName,
    location: document.getElementById('f_location').value.trim(),
    status,
    score_home: status==='played' ? (parseInt(document.getElementById('f_score_home').value)||0) : null,
    score_away: status==='played' ? (parseInt(document.getElementById('f_score_away').value)||0) : null,
    notes: document.getElementById('f_notes').value.trim(),
    updatedAt: new Date().toISOString(),
  };

  btn.disabled=true; btn.textContent='⏳ Salvataggio...';
  try {
    if (window._st.matchId) {
      await updateDoc(doc(db,'matches',window._st.matchId), data);
      showToast('✅ Partita aggiornata!');
    } else {
      data.createdAt = new Date().toISOString();
      await addDoc(collection(db,'matches'), data);
      showToast('✅ Partita aggiunta!');
    }
    closeOverlay('matchOverlay');
  } catch(e) { showToast('❌ '+e.message); }
  btn.disabled=false; btn.textContent='💾 Salva Partita';
};

window.deleteMatch = async function(id) {
  if (!confirm('Eliminare questa partita?')) return;
  try { await deleteDoc(doc(db,'matches',id)); showToast('🗑️ Eliminata'); }
  catch(e) { showToast('❌ '+e.message); }
};

};

window.deleteTeam = async function(id) {
  const inUse = window._st.matches.some(m=>m.homeId===id||m.awayId===id);
  if (inUse && !confirm('Questa squadra è usata in una o più partite. Eliminarla comunque?')) return;
  if (!inUse && !confirm('Eliminare questa squadra?')) return;
  try { await deleteDoc(doc(db,'teams',id)); showToast('🗑️ Squadra eliminata'); }
  catch(e) { showToast('❌ '+e.message); }
};

// ══════════════════════════════════════════════
//  TOAST
// ══════════════════════════════════════════════
window.showToast = function(msg) {
  const t = document.getElementById('toast');
  t.textContent = msg; t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'), 2800);
};

// ══════════════════════════════════════════════
//  INIT
// ══════════════════════════════════════════════
const fabBtn = document.getElementById('fabBtn');
initFirebase();
startListeners();
fabBtn.style.display = 'flex';
fabBtn.onclick = ()=>openMatchModal(null);

</script>
